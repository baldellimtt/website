<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% if section %}{{ section.description | default(value=config.description) }}{% else %}{{ config.description }}{% endif %}{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='css/main.css') }}">
</head>
<body>
  <header class="site-header">
    <nav class="site-header__lang" aria-label="{% if lang == 'en' %}Language{% else %}Lingua{% endif %}">
      <a href="{{ get_url(path='/', lang='it') }}" {% if lang == 'it' %}aria-current="page"{% endif %}>IT</a>
      <span aria-hidden="true">/</span>
      <a href="{{ get_url(path='/', lang='en') }}" {% if lang == 'en' %}aria-current="page"{% endif %}>EN</a>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>© 2026 Matteo Baldelli</p>
  </footer>
</body>
</html>
